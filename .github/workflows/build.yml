name: Build

on:
  push:
    branches: [main, nvidium]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify pinned Nvidium source and mixin contracts
        shell: bash
        run: |
          set -euo pipefail
          nvidium_dir="$RUNNER_TEMP/nvidium-source"
          sodium_dir="$RUNNER_TEMP/sodium-source"
          mkdir -p "$nvidium_dir" "$sodium_dir"
          curl --fail --silent --show-error --location \
            "https://github.com/MCRcortex/nvidium/archive/e600501ab840ba821bbea8bb36616feec8e476ef.tar.gz" \
            | tar -xz --strip-components=1 -C "$nvidium_dir"
          curl --fail --silent --show-error --location \
            "https://github.com/CaffeineMC/sodium/archive/4d408fb488fda38d9bc8cba66ca62384e000fcdc.tar.gz" \
            | tar -xz --strip-components=1 -C "$sodium_dir"
          python3 .github/scripts/verify_nvidium_source_contract.py "$nvidium_dir" "$GITHUB_WORKSPACE" "$sodium_dir"
          echo "NVIDIUM_SOURCE_DIR=$nvidium_dir" >> "$GITHUB_ENV"

      - name: Check out pinned Photon shader-pack sources
        shell: bash
        run: |
          set -euo pipefail
          photon_dir="$RUNNER_TEMP/photon-source"
          mkdir -p "$photon_dir"
          curl --fail --silent --show-error --location \
            "https://github.com/sixthsurge/photon/archive/2a3d502c17d2e310412c717be47241f014cba7fc.tar.gz" \
            | tar -xz --strip-components=1 -C "$photon_dir"
          test -s "$photon_dir/shaders/world0/gbuffers_terrain.vsh"
          test -s "$photon_dir/shaders/world0/gbuffers_terrain.fsh"
          echo "PHOTON_SOURCE_DIR=$photon_dir" >> "$GITHUB_ENV"

      - name: Download pinned Complementary Reimagined r5.9.3 archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ComplementaryReimagined_r5.9.3.zip"
          curl --fail --silent --show-error --location \
            "https://cdn.modrinth.com/data/HVnmMxH1/versions/Bqen1mJX/ComplementaryReimagined_r5.9.3.zip" \
            --output "$archive"
          test -s "$archive"
          unzip -Z1 "$archive" | grep -qx 'shaders/shaders.properties'
          echo "COMPLEMENTARY_SOURCE_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Install GLSL compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes glslang-tools xvfb libgl1-mesa-dri libglx-mesa0

      - name: Build mod and package example shader pack
        shell: bash
        env:
          GLSLANG_VALIDATOR: glslangValidator
          CAUSTIQ_COMPAT_OUTPUT_DIR: ${{ github.workspace }}/build/nvidium-compat
          CAUSTIQ_GL_SMOKE: "1"
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 ./gradlew build --stacktrace --info 2>&1 | tee build.log

      - name: Verify pinned Photon and Nvidium integration tests executed (not skipped)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          test_name = "translatesEveryPinnedPhotonDimensionAgainstTheActualPinnedNvidiumShaderStages"
          matches = []
          for report in glob.glob("build/test-results/test/TEST-*.xml"):
              root = ET.parse(report).getroot()
              matches.extend(case for case in root.iter("testcase") if case.attrib.get("name", "").split("(")[0] == test_name)

          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one executed Photon terrain audit test, found {len(matches)}")
          if matches[0].find("skipped") is not None:
              raise SystemExit("Photon terrain audit was skipped instead of running against the pinned source.")
          if matches[0].find("failure") is not None or matches[0].find("error") is not None:
              raise SystemExit("Photon terrain audit failed.")
          combined_test = "nativeVertexAbiAdapterAndIrisTranslatorComposeAgainstPinnedNvidiumSources"
          combined_matches = []
          for report in glob.glob("build/test-results/test/TEST-*.xml"):
              root = ET.parse(report).getroot()
              combined_matches.extend(case for case in root.iter("testcase") if case.attrib.get("name", "").split("(")[0] == combined_test)
          if len(combined_matches) != 1 or combined_matches[0].find("skipped") is not None:
              raise SystemExit("Pinned Nvidium + Photon combined-source integration test did not execute.")
          if combined_matches[0].find("failure") is not None or combined_matches[0].find("error") is not None:
              raise SystemExit("Pinned Nvidium + Photon combined-source integration test failed.")
          photon_compute_tests = {
              "resolvesPinnedPhotonLpvComputeProgramsAndTheir3dImages",
              "executesPinnedPhotonLpvComputeProgramsOnHeadlessOpenGl",
          }
          photon_matches = []
          for report in glob.glob("build/test-results/test/TEST-*.xml"):
              root = ET.parse(report).getroot()
              photon_matches.extend(
                  case for case in root.iter("testcase")
                  if case.attrib.get("name", "").split("(")[0] in photon_compute_tests
              )
          if len(photon_matches) != len(photon_compute_tests):
              raise SystemExit(
                  f"Expected {len(photon_compute_tests)} executed Photon LPV audit test(s), found {len(photon_matches)}"
              )
          for case in photon_matches:
              if case.find("skipped") is not None:
                  raise SystemExit(f"Photon LPV audit was skipped: {case.attrib.get('name')}")
              if case.find("failure") is not None or case.find("error") is not None:
                  raise SystemExit(f"Photon LPV audit failed: {case.attrib.get('name')}")
          terrain_render_test = "rendersTheTranslatedPhotonTerrainVertexAndFragmentProgramsOnMesa"
          terrain_render_matches = []
          for report in glob.glob("build/test-results/test/TEST-*.xml"):
              root = ET.parse(report).getroot()
              terrain_render_matches.extend(
                  case for case in root.iter("testcase")
                  if case.attrib.get("name", "").split("(")[0] == terrain_render_test
              )
          if len(terrain_render_matches) != 1:
              raise SystemExit(
                  f"Expected exactly one translated Photon terrain render test, found {len(terrain_render_matches)}"
              )
          render_case = terrain_render_matches[0]
          if render_case.find("skipped") is not None:
              raise SystemExit("Translated Photon terrain render smoke test was skipped.")
          if render_case.find("failure") is not None or render_case.find("error") is not None:
              raise SystemExit("Translated Photon terrain render smoke test failed.")
          print("Verified pinned-source terrain/shadow audits, Photon LPV compute execution, and Mesa terrain framebuffer rendering.")
          PY

      - name: Verify every pinned Complementary Reimagined r5.9.3 expression executed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          test_name = "evaluatesEveryCustomUniformAndVariableFromPinnedR593Archive"
          matches = []
          for report in glob.glob("build/test-results/test/TEST-*.xml"):
              root = ET.parse(report).getroot()
              matches.extend(
                  case for case in root.iter("testcase")
                  if case.attrib.get("name", "").split("(")[0] == test_name
              )
          if len(matches) != 1:
              raise SystemExit(
                  f"Expected exactly one Complementary r5.9.3 expression audit, found {len(matches)}"
              )
          case = matches[0]
          if case.find("skipped") is not None:
              raise SystemExit("Complementary r5.9.3 expression audit was skipped.")
          if case.find("failure") is not None or case.find("error") is not None:
              raise SystemExit("Complementary r5.9.3 expression audit failed.")
          print("Verified every custom uniform and variable expression from the pinned Complementary r5.9.3 archive.")
          PY

      - name: Compile generated Nvidium adapter GLSL helpers
        shell: bash
        run: |
          set -euo pipefail
          compat_dir="build/nvidium-compat"
          validation_dir="$RUNNER_TEMP/nvidium-glsl-validation"
          mkdir -p "$validation_dir"
          python3 - "$compat_dir" "$validation_dir" <<'PY'
          import pathlib
          import re
          import sys

          source_dir, output_dir = map(pathlib.Path, sys.argv[1:])
          shaders = (
              "photon-nvidium-terrain.mesh",
              "photon-nvidium-terrain.frag",
              "photon-nvidium-shadow.mesh",
              "photon-nvidium-shadow.frag",
          )
          bindless_extension = re.compile(
              r"(?m)^[ \t]*#[ \t]*extension[ \t]+GL_NV_bindless_texture\b"
          )
          bindless_constructor = re.compile(
              r"\bsampler(?:1D|2D|3D|Cube|1DArray|2DArray|CubeArray)\s*"
              r"\(\s*(?:u?int64_t|uint64_t)\b"
          )
          generated = {}
          for name in shaders:
              path = source_dir / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing generated shader: {path}")
              source = path.read_text()
              if bindless_extension.search(source) and bindless_constructor.search(source):
                  raise SystemExit(
                      f"{name} uses NV bindless sampler construction; it cannot be passed to glslang."
                  )
              generated[name] = source

          mesh = generated["photon-nvidium-terrain.mesh"]
          begin = "// CAUSTIQ_NVIDIUM_ADAPTER_HELPERS_BEGIN"
          end = "// CAUSTIQ_NVIDIUM_ADAPTER_HELPERS_END"
          if mesh.count(begin) != 1 or mesh.count(end) != 1:
              raise SystemExit("Generated terrain mesh is missing the unique adapter-helper markers.")
          helpers = mesh.split(begin, 1)[1].split(end, 1)[0]
          if not helpers.strip():
              raise SystemExit("Generated terrain adapter helper block is empty.")

          harness = """#version 460
          struct Vertex {
              uint normal;
              uint material;
              uint midUV;
              uint midBlock;
              uint blockId;
              uint nvidiumMaterial;
              uint color;
          };
          const float COLOR_SCALE = 1.0 / 255.0;
          vec4 decodeVertexColour(Vertex vertex) { return vec4(1.0); }
          """ + helpers + "\nvoid main() {\n    Vertex vertex = Vertex(0u, 0u, 0u, 0u, 0u, 0u, 0u);\n    gl_Position = vec4(caustiqDecodeNormal(vertex), 1.0);\n}\n"
          (output_dir / "nvidium-adapter-helpers.vert").write_text(harness)
          print("Validated four generated Nvidium terrain/shadow stages are present and bindless usage is not silently stripped.")
          print("Extracted the exact injected adapter helper block for standalone GLSL compilation.")
          PY
          glslangValidator -S vert "$validation_dir/nvidium-adapter-helpers.vert"

      - name: Verify complete captured Nvidium shader stages
        shell: bash
        run: |
          set -euo pipefail
          python3 - build/nvidium-compat <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          required = (
              "photon-nvidium-terrain.task",
              "photon-nvidium-terrain.mesh",
              "photon-nvidium-terrain.frag",
              "photon-nvidium-shadow.mesh",
              "photon-nvidium-shadow.frag",
              "nvidium-native.mesh",
              "nvidium-native.frag",
              "nvidium-extended.mesh",
              "nvidium-extended.frag",
          )
          missing = [name for name in required if not (root / name).is_file() or (root / name).stat().st_size == 0]
          if missing:
              raise SystemExit(f"Missing complete Nvidium source snapshots: {missing}")
          mesh = (root / "photon-nvidium-terrain.mesh").read_text()
          for contract in (
              "#define USE_SODIUM_VERTEX_FORMAT",
              "struct Vertex",
              "uint nvidiumMaterial;",
              "void caustiqIrisVertexMain()",
              "vec4 transformVertex(Vertex V)",
          ):
              if contract not in mesh:
                  raise SystemExit(f"Generated terrain mesh is missing required ABI/source contract: {contract}")
          print("Verified pre-adaptation, extended-ABI, and final translated TASK/MESH/FRAGMENT source snapshots.")
          PY

      - name: Validate bundled GLSL
        shell: bash
        run: |
          set -euo pipefail
          glslangValidator -S vert examples/caustiq-stillwater/shaders/final.vsh
          glslangValidator -S frag examples/caustiq-stillwater/shaders/final.fsh
          for stage in gbuffers_terrain shadow; do
            glslangValidator -S vert "examples/caustiq-lumina/shaders/$stage.vsh"
            glslangValidator -S frag "examples/caustiq-lumina/shaders/$stage.fsh"
          done
          for stage in deferred composite final; do
            glslangValidator -S frag "examples/caustiq-lumina/shaders/$stage.fsh"
          done

      - name: Verify distributable JAR
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/caustiq-*.jar)
          distributable=()
          for jar in "${jars[@]}"; do
            [[ "$jar" == *-sources.jar ]] || distributable+=("$jar")
          done

          if (( ${#distributable[@]} != 1 )); then
            printf 'Expected exactly one remapped Caustiq JAR, found %s.\n' "${#distributable[@]}" >&2
            printf 'JAR candidates: %s\n' "${jars[*]:-<none>}" >&2
            exit 1
          fi

          test -s "${distributable[0]}"
          echo "Distributable JAR: ${distributable[0]}"
          echo "CAUSTIQ_JAR=${distributable[0]}" >> "$GITHUB_ENV"

      - name: Verify Nvidium distribution and renderer hooks
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${CAUSTIQ_JAR}" <<'PY'
          import json
          import sys
          import zipfile

          jar_path = sys.argv[1]
          with zipfile.ZipFile(jar_path) as jar:
              metadata = json.loads(jar.read("fabric.mod.json"))
              mixins = json.loads(jar.read("caustiq.mixins.json"))
              required_classes = {
                  "dev/itsdropper/caustiq/mixin/NvidiumWorldRendererMixin.class",
                  "dev/itsdropper/caustiq/mixin/NvidiumShaderBuilderMixin.class",
                  "dev/itsdropper/caustiq/mixin/NvidiumIrisCheckMixin.class",
                  "dev/itsdropper/caustiq/mixin/NvidiumTerrainRasterizerMixin.class",
                  "dev/itsdropper/caustiq/mixin/NvidiumExtendedVertexFormatMixin.class",
                  "dev/itsdropper/caustiq/mixin/NvidiumRepackagedStrideMixin.class",
                  "dev/itsdropper/caustiq/mixin/NvidiumBlockRendererVertexContextMixin.class",
                  "dev/itsdropper/caustiq/mixin/NvidiumFluidRendererVertexContextMixin.class",
                  "dev/itsdropper/caustiq/integration/nvidium/NvidiumGBufferTargets.class",
                  "dev/itsdropper/caustiq/integration/nvidium/NvidiumShadowRenderer.class",
                  "dev/itsdropper/caustiq/integration/nvidium/NvidiumIrisChunkVertex.class",
                  "dev/itsdropper/caustiq/integration/nvidium/NvidiumVertexAbiState.class",
                  "dev/itsdropper/caustiq/integration/nvidium/NvidiumIrisTextureBridge.class",
                  "dev/itsdropper/caustiq/integration/nvidium/NvidiumIrisVertexContext.class",
                  "dev/itsdropper/caustiq/integration/nvidium/NvidiumShaderProgramBridge.class",
                  "dev/itsdropper/caustiq/integration/nvidium/NvidiumTerrainVaryingAdapter.class",
                  "dev/itsdropper/caustiq/shaderpack/IrisGlPassExecutor.class",
                  "dev/itsdropper/caustiq/shaderpack/IrisGlProgramCompiler.class",
                  "dev/itsdropper/caustiq/shaderpack/IrisImageResources.class",
                  "dev/itsdropper/caustiq/shaderpack/IrisShaderResources.class",
              }

              assert metadata["id"] == "caustiq", metadata["id"]
              assert metadata["depends"]["sodium"] == "=0.8.12", metadata["depends"]
              assert metadata["depends"]["nvidium"] == "=0.4.3-beta13-1.21.11", metadata["depends"]
              assert set(mixins["client"]).issuperset({
                  "NvidiumWorldRendererMixin",
                  "NvidiumShaderBuilderMixin",
                  "NvidiumIrisCheckMixin",
                  "NvidiumTerrainRasterizerMixin",
                  "NvidiumExtendedVertexFormatMixin",
                  "NvidiumRepackagedStrideMixin",
                  "NvidiumBlockRendererVertexContextMixin",
                  "NvidiumFluidRendererVertexContextMixin",
              }), mixins["client"]
              assert required_classes.issubset(set(jar.namelist())), required_classes - set(jar.namelist())
              assert "caustiq-nvidium" in jar_path, jar_path

          print("Verified Nvidium metadata, renderer hooks, shader compile interception, and Iris safety gate.")
          PY

      - name: Verify Stillwater shader ZIP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(build/distributions/caustiq-stillwater-*.zip)
          if (( ${#zips[@]} != 1 )); then
            printf 'Expected exactly one Stillwater shader ZIP, found %s.\n' "${#zips[@]}" >&2
            exit 1
          fi
          test -s "${zips[0]}"
          python3 - "${zips[0]}" <<'PY'
          import sys
          import zipfile

          path = sys.argv[1]
          required = {"README.md", "shaders/final.fsh", "shaders/final.vsh"}
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              missing = required - names
              if missing:
                  raise SystemExit(f"Shader ZIP is missing: {sorted(missing)}")
              if any(name.startswith(("/", "../")) or "/../" in name for name in names):
                  raise SystemExit("Shader ZIP contains an unsafe path")
          print(f"Verified shader pack archive: {path}")
          PY
          echo "CAUSTIQ_SHADER_ZIP=${zips[0]}" >> "$GITHUB_ENV"

      - name: Verify Lumina shader ZIP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(build/distributions/caustiq-lumina-*.zip)
          if (( ${#zips[@]} != 1 )); then
            printf 'Expected exactly one Lumina shader ZIP, found %s.\n' "${#zips[@]}" >&2
            exit 1
          fi
          test -s "${zips[0]}"
          echo "CAUSTIQ_LUMINA_ZIP=${zips[0]}" >> "$GITHUB_ENV"

      - name: Upload Caustiq JAR
        uses: actions/upload-artifact@v4
        with:
          name: caustiq-${{ github.sha }}
          path: ${{ env.CAUSTIQ_JAR }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Stillwater shader pack
        uses: actions/upload-artifact@v4
        with:
          name: caustiq-stillwater-${{ github.sha }}
          path: ${{ env.CAUSTIQ_SHADER_ZIP }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Lumina shader pack
        uses: actions/upload-artifact@v4
        with:
          name: caustiq-lumina-${{ github.sha }}
          path: ${{ env.CAUSTIQ_LUMINA_ZIP }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caustiq-build-log
          path: build.log
          if-no-files-found: ignore
 
      - name: Upload generated Nvidium shader sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caustiq-nvidium-shader-sources-${{ github.sha }}
          path: build/nvidium-compat/
          if-no-files-found: ignore
          retention-days: 14
