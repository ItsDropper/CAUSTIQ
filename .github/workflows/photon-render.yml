name: Photon Minecraft Shader Validation

on:
  push:
    branches: [nvidium]
    paths:
      - ".github/workflows/photon-render.yml"
      - "src/**"
      - "build.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photon-minecraft-${{ github.ref }}
  cancel-in-progress: true

jobs:
  photon-minecraft:
    name: Launch Minecraft without Nvidium and compile Photon
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out CAUSTIQ
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Mesa and virtual display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes xvfb libgl1-mesa-dri libglx-mesa0

      - name: Download pinned Photon shader pack
        shell: bash
        run: |
          set -euo pipefail
          photon_dir="$RUNNER_TEMP/photon-source"
          mkdir -p "$photon_dir" run/shaderpacks/Photon
          curl --fail --silent --show-error --location \
            "https://github.com/sixthsurge/photon/archive/2a3d502c17d2e310412c717be47241f014cba7fc.tar.gz" \
            | tar -xz --strip-components=1 -C "$photon_dir"
          test -s "$photon_dir/shaders/world0/gbuffers_terrain.vsh"
          test -s "$photon_dir/shaders/world0/gbuffers_terrain.fsh"
          cp -a "$photon_dir/." run/shaderpacks/Photon/
          echo "CAUSTIQ_CI_SHADERPACK=$GITHUB_WORKSPACE/run/shaderpacks/Photon" >> "$GITHUB_ENV"
          echo "Pinned Photon revision: 2a3d502c17d2e310412c717be47241f014cba7fc" >> "$GITHUB_STEP_SUMMARY"

      - name: Launch actual Minecraft client and validate Photon in its GL context
        shell: bash
        env:
          CAUSTIQ_CI_SHADER_VALIDATION: "1"
          CAUSTIQ_CI_SHADERPACK: ${{ github.workspace }}/run/shaderpacks/Photon
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.6"
          CAUSTIQ_CI_SCREENSHOT: ${{ github.workspace }}/build/caustiq-photon-minecraft/minecraft-photon-validation.png
        run: |
          set -uo pipefail
          mkdir -p build/caustiq-photon-minecraft
          log="$GITHUB_WORKSPACE/build/caustiq-photon-minecraft/minecraft.log"
          screenshot="$GITHUB_WORKSPACE/build/caustiq-photon-minecraft/minecraft-photon-validation.png"
          export CAUSTIQ_CI_SHADER_VALIDATION CAUSTIQ_CI_SHADERPACK LIBGL_ALWAYS_SOFTWARE MESA_GL_VERSION_OVERRIDE CAUSTIQ_CI_SCREENSHOT
          setsid ./gradlew runClient --stacktrace --info > "$log" 2>&1 &
          client_pid=$!
          result=timeout
          for second in $(seq 1 480); do
            if grep -q "CAUSTIQ_CI_SHADER_VALIDATION_PASS" "$log"; then
              result=pass
              break
            fi
            if grep -q "CAUSTIQ_CI_SHADER_VALIDATION_FAIL" "$log"; then
              result=fail
              break
            fi
            if ! kill -0 "$client_pid" 2>/dev/null; then
              result=exited
              break
            fi
            sleep 1
          done
          kill -- -"$client_pid" 2>/dev/null || true
          wait "$client_pid" 2>/dev/null || true
          echo "Minecraft validation result: $result"
          test "$result" = pass
          test -s "$screenshot"

      - name: Verify Minecraft and Photon validation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log="build/caustiq-photon-minecraft/minecraft.log"
          test -s "$log"
          if ! grep -q "CAUSTIQ_CI_SHADER_VALIDATION_PASS" "$log"; then
            echo "Photon did not complete successfully inside Minecraft."
            tail -n 160 "$log"
            exit 1
          fi
          if grep -E "ERROR.*(Shader|shader|GLSL)|failed to compile|failed to link" "$log"; then
            echo "Shader-related error was reported by Minecraft."
            exit 1
          fi
          echo "Minecraft launched without Nvidium and linked the pinned Photon shader programs in its OpenGL context." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Minecraft screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caustiq-photon-minecraft-diagnostics-${{ github.sha }}
          path: |
            build/caustiq-photon-minecraft/
            run/logs/latest.log
            run/crash-reports/
          if-no-files-found: ignore
          retention-days: 14
