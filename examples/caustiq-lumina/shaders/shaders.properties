# Lumina - render targets, custom uniforms and the option screen.

# ---- render targets -----------------------------------------------------------
# colortex0 is Minecraft's main RGBA8 target and keeps that format.
#   colortex1  world normal (xyz), foliage class (w)
#   colortex2  view depth, emission, fog factor, vanilla AO
#   colortex3  copy of the terrain colour (validity check) + sun share
#   colortex4  bloom source; mip-mapped, the chain is the blur
#   colortex5  view-space light direction (xyz) + sun gate (w)
colortex1Format=RGBA16F
colortex2Format=RGBA16F
colortex3Format=RGBA16F
colortex4Format=RGBA16F
colortex5Format=RGBA16F
colortex4Mipmap=true

# ---- shadow map ---------------------------------------------------------------
# Rendered by the runtime's isolated Nvidium shadow pipeline from shadow.vsh/fsh.
# 2048 texels over a 2 x 96 block window is ~10 texels per block.
shadowMapResolution=2048
shadowDistance=96

# ---- custom uniforms ----------------------------------------------------------
# Fullscreen passes do not receive the world clock or weather directly.
uniform.float.lumClock=worldTime / 24000.0
uniform.float.lumRain=rainStrength
# Biome of the camera. Used for gentle atmosphere shifts only.
uniform.float.lumBiomeTemp=temperature
uniform.float.lumBiomeRain=rainfall

# ---- options ------------------------------------------------------------------
screen=EXPOSURE FOG_DENSITY TORCH_STRENGTH BIOME_ATMOSPHERE SHADOW_SAMPLES SHADOW_SOFTNESS SWAY_STRENGTH SSAO_STRENGTH CONTACT_SHADOWS BLOOM_STRENGTH BLOOM_THRESHOLD SUN_GLOW LIGHT_RAYS FXAA SATURATION CONTRAST VIGNETTE GRAIN
